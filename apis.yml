aid: blackswan-technologies
name: BlackSwan Technologies
description: 'BlackSwan Technologies is an enterprise AI software company founded in
  2014 by Michael and Elinoar Ouliel, headquartered in London with engineering across
  Israel, Poland and India. Its flagship product, ELEMENT, is marketed as an Enterprise
  AI Operating System: a low/no-code platform-as-a-service combining a data fabric,
  knowledge graphs, machine learning and composite AI so banks and other regulated
  enterprises can assemble applications for KYC on demand, enhanced due diligence,
  financial crime, transaction intelligence, market intelligence and underwriting without
  first consolidating their data. Its software engineering unit, BST LABS, built and
  open-sourced CAIOS (Cloud AI Operating System) and a family of Python developer tools
  (DynaCLI, CLVM, PyJdict, PyComposite, AuthK). BlackSwan Technologies was acquired
  by HUB Cyber Security Ltd. (NASDAQ: HUBC) in a stock-for-stock transaction that closed
  on 27 January 2025, and its corporate domain blackswantechnologies.ai no longer resolves
  in DNS; the secured data fabric technology is now marketed under HUB Technologies.
  No public API, developer portal, or machine-readable API contract (OpenAPI, GraphQL,
  AsyncAPI, MCP, A2A) was found for BlackSwan Technologies during enrichment.'
