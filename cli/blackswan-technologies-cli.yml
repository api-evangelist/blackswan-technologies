clis:
- name: clvm
  package: pyclvm
  version: 1.1.11
  description: Cloud VM command line tool for starting, stopping, listing, tunnelling
    into and port-forwarding cloud instances on AWS, Azure and GCP, with VS Code Remote
    integration.
  repo: https://github.com/BstLabs/py-clvm
  changelog: https://github.com/BstLabs/py-clvm/blob/main/CHANGELOG.md
  license: https://github.com/BstLabs/py-clvm/blob/main/LICENSE.md
  install:
  - method: pip
    command: pip3 install pyclvm
  - method: local-development
    command: flit install --symlink
  built_on: dynacli
  platforms:
  - aws
  - azure
  - gcp
  capabilities:
  - Instance start/stop and listing operations
  - SSH key generation and tunneling
  - Session management
  - Port redirection (forwarding)
  - VS Code Remote utilities
  examples:
  - command: clvm ssh new <vm_instance_name> platform=<aws|gcp|azure>
    description: Create a new SSH session to a cloud VM instance.
  - command: clvm vscode start <vm_instance_name>
    description: Start a VS Code Remote session against a cloud VM instance.
- name: dynacli
  package: dynacli
  version: 1.0.8
  description: Python package structure interpreter that makes any public function
    executable from the command line — the CLI framework the other BST LABS tools are
    built on.
  repo: https://github.com/BstLabs/py-dynacli
  docs: https://bstlabs.github.io/py-dynacli/
  install:
  - method: pip
    command: pip install dynacli
